name: Bug report
description: Report a reproducible problem in ztrans.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal reproducible example
      description: Include the smallest code example that reproduces the issue.
      render: python
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.0"
    validations:
      required: true
  - type: input
    id: sympy-version
    attributes:
      label: SymPy version
      placeholder: "1.14.0"
    validations:
      required: true
